<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Legaltech Evolution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold text-primary mb-1">Legaltech Evolution</h4>
                        <p class="text-muted small">Acesso ao Portal Jurídico</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger py-2 small">
                        Usuário ou senha inválidos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2 small">
                        Sessão encerrada com sucesso.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold">E-mail</label>
                            <input type="text" id="username" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold">Senha</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">Entrar</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-muted small text-center mb-2">Preenchimento rápido para teste:</p>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-dark btn-sm"
                                onclick="preencher('admin@legaltech.com', 'admin123')">
                            Perfil Gestor (ROLE_ADMIN)
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                onclick="preencher('operador@legaltech.com', 'oper123')">
                            Perfil Operador (ROLE_OPERADOR)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function preencher(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
    }
</script>
</body>
</html>
