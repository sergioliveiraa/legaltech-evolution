<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão Administrativa | Legaltech Evolution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <span class="badge bg-warning text-dark mb-1">Área Exclusiva ROLE_ADMIN</span>
            <h3 class="fw-bold mb-0">Gestão Financeira de Contratos</h3>
        </div>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">Voltar ao Dashboard</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Início</th>
                    <th>Fim</th>
                    <th>Valor Mensal</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${contratos}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.dataInicio}">2026-01-01</td>
                    <td th:text="${c.dataFim != null ? c.dataFim : 'Indeterminado'}">-</td>
                    <td th:text="${'R$ ' + c.valorMensal}">R$ 0,00</td>
                    <td>
                        <span th:if="${!c.cancelamentoConfirmado}" class="badge bg-success">Ativo</span>
                        <span th:if="${c.cancelamentoConfirmado}" class="badge bg-danger">Cancelado</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contratos)}">
                    <td colspan="5" class="text-center text-muted py-3">Nenhum contrato encontrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
